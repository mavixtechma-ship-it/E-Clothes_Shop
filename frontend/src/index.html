<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP: everything is same-origin (fonts, icons and data are bundled; the API is
      the in-browser /mock-api). 'unsafe-inline' for styles is required by PrimeNG's
      runtime theming. frame-ancestors / HSTS must be sent as real HTTP headers by
      the host — meta tags cannot set them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'self' blob:"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Loomline — Menswear, woven well</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Loomline — a demo menswear store and admin studio. Mock data only." />
    <meta name="theme-color" content="#233150" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
