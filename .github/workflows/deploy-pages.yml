# Builds the Angular app and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The site is served from https://<user>.github.io/E-Clothes_Shop/
      - run: npx ng build --configuration production --base-href /E-Clothes_Shop/

      # SPA fallback: unknown paths (deep links / refresh) load the app instead of a 404,
      # and .nojekyll stops Pages from dropping files that start with "_".
      - name: Prepare Pages output
        run: |
          cp dist/loomline/browser/index.html dist/loomline/browser/404.html
          touch dist/loomline/browser/.nojekyll
          # Hearth Kitchen (static Arabic shop) is published alongside the store at /hearth-kitchen/
          mkdir -p dist/loomline/browser/hearth-kitchen
          cp ../index2.htm dist/loomline/browser/hearth-kitchen/index.html
          if [ -d ../assets ]; then cp -r ../assets dist/loomline/browser/hearth-kitchen/assets; fi
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/loomline/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
